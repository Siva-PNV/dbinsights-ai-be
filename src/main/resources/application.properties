server.port=${PORT:8080}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.security.admin-token=${DBINSIGHT_ADMIN_TOKEN:dbinsight-admin-token}
app.security.database-credentials-key=${DBINSIGHT_DATABASE_CREDENTIALS_KEY:}

spring.datasource.url=${DBINSIGHT_DB_URL:jdbc:postgresql://127.0.0.1:5432/dbinsight}
spring.datasource.username=${DBINSIGHT_DB_USER:postgres}
spring.datasource.password=${DBINSIGHT_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.auth.password-reset.enabled=${PASSWORD_RESET_ENABLED:false}
app.auth.password-reset.from=${PASSWORD_RESET_FROM:no-reply@localhost}
app.auth.password-reset.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.auth.password-reset.token-ttl-minutes=${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
app.auth.email-verification.enabled=${EMAIL_VERIFICATION_ENABLED:${PASSWORD_RESET_ENABLED:false}}
app.auth.email-verification.token-ttl-hours=${EMAIL_VERIFICATION_TOKEN_TTL_HOURS:24}
app.telemetry.collection-interval-ms=${DBINSIGHT_TELEMETRY_INTERVAL_MS:30000}
app.telemetry.slow-query-threshold-ms=${DBINSIGHT_SLOW_QUERY_THRESHOLD_MS:500}
app.ai.recommendations.enabled=${DBINSIGHT_AI_RECOMMENDATIONS_ENABLED:false}
app.ai.recommendations.cache-ttl-ms=${DBINSIGHT_AI_RECOMMENDATIONS_CACHE_TTL_MS:300000}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
app.ai.gemini.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta}